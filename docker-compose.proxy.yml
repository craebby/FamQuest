# Betrieb hinter einem Reverse Proxy im selben Docker-Netzwerk (z. B. Nginx Proxy Manager,
# Traefik, Caddy). Einschalten in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.proxy.yml
#   PROXY_NETWORK=proxy
# Die App hängt dann zusätzlich im (bereits bestehenden) Netzwerk PROXY_NETWORK und ist dort als
# "famquest:8000" erreichbar. Auf dem Host wird kein Port veröffentlicht.
services:
  app:
    ports: !reset []
    networks:
      default:
      proxy:
        aliases: [famquest]
    environment:
      # Nur der Proxy erreicht die App; seinen X-Forwarded-*-Headern darf sie daher vertrauen.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}

networks:
  proxy:
    name: ${PROXY_NETWORK:-proxy}
    external: true
