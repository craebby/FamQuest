services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-famquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-famquest}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    image: famquest:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &app-env
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-famquest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
      POSTGRES_DB: ${POSTGRES_DB:-famquest}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      PUBLIC_URL: ${PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      CALENDAR_SYNC_MINUTES: ${CALENDAR_SYNC_MINUTES:-5}
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Backend-Tests im Container:  docker compose --profile test run --rm tests
  tests:
    profiles: [test]
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env

volumes:
  db-data:
  uploads:
